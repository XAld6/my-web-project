<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单筋矩形截面承载力计算器</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>单筋矩形受弯构件正截面承载力计算</h1>
        <p>请输入构件的设计参数，点击“开始计算”即可得到详细的计算过程和结果。</p>
    </header>
    <main>
        <section class="calculator">
            <h2>参数输入</h2>
            <form id="capacity-form">
                <div class="form-grid">
                    <label>
                        混凝土抗压强度设计值 f<sub>c</sub> (MPa)
                        <input type="number" step="0.1" id="fc" required value="14.3">
                    </label>
                    <label>
                        受拉钢筋抗拉强度设计值 f<sub>y</sub> (MPa)
                        <input type="number" step="1" id="fy" required value="360">
                    </label>
                    <label>
                        截面宽度 b (mm)
                        <input type="number" step="1" id="b" required value="250">
                    </label>
                    <label>
                        截面总高度 h (mm)
                        <input type="number" step="1" id="h" required value="500">
                    </label>
                    <label>
                        混凝土保护层厚度 a<sub>s</sub> (mm)
                        <input type="number" step="1" id="cover" required value="35">
                    </label>
                    <label>
                        受拉钢筋面积 A<sub>s</sub> (mm²)
                        <input type="number" step="1" id="as" required value="1963">
                    </label>
                    <label>
                        抗压区等效系数 α<sub>1</sub>
                        <input type="number" step="0.01" id="alpha1" required value="1.0">
                    </label>
                    <label>
                        相对受压区高度限值 ξ<sub>b</sub>
                        <input type="number" step="0.01" id="xiLimit" required value="0.518">
                    </label>
                </div>
                <button type="submit" class="primary-btn">开始计算</button>
                <button type="reset" class="secondary-btn">重置</button>
            </form>
        </section>

        <section class="results" id="results">
            <h2>计算结果</h2>
            <div class="result-content" id="result-content">
                <p>请先输入参数并点击“开始计算”。</p>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 单筋矩形截面承载力计算器</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
